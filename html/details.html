<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HobbyHub - Details</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/details.css" />
    <link rel="stylesheet" href="/css/hobby-card.css" />
  </head>
  <body>
    <div class="grid-container">
      <header>

        <h1>
          HobbyHub
        </h1>
        <h2 id="subheading">
          - Find your next obsession -
        </h2>
      </header>
      <nav class="main-nav">
        <a href="index.html">EXPLORE</a>
        <a href="liked-hobbies.html">MY LIKED HOBBIES</a>
        <a href="#signup">SIGN UP</a>
      </nav>
      <main>
        <!---When a specific hobby is selected, its details will be displayed here -->
        <section id="hobby-details"></section>

        <section class="newsletter" id="signup">
          <h2>Subscribe to our Newsletter</h2>
          <p>Get the latest hobby trends and tips delivered to your inbox.</p>

          <form id="newsletter-form">
            <fieldset>
              <legend>Personal Information</legend>

              <div class="form-field">
                <label for="fname">First Name</label>
                <input
                  type="text"
                  id="fname"
                  name="first-name"
                  placeholder="Enter your first name"
                  required
                />
              </div>

              <div class="form-field">
                <label for="lname">Last Name</label>
                <input
                  type="text"
                  id="lname"
                  name="last-name"
                  placeholder="Enter your last name"
                  required
                />
              </div>

              <div class="form-field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="your.email@example.com"
                  required
                />
              </div>
            </fieldset>

            <fieldset>
              <legend>Which hobby categories do you like?</legend>

              <div class="checkbox-group">
                <label>
                  <input type="checkbox" name="interests" value="creative" />
                  Creative
                </label>

                <label>
                  <input type="checkbox" name="interests" value="active" />
                  Active
                </label>

                <label>
                  <input type="checkbox" name="interests" value="outdoors" />
                  Outdoors
                </label>

                <label>
                  <input type="checkbox" name="interests" value="music" />
                  Music
                </label>

                <label>
                  <input type="checkbox" name="interests" value="learning" />
                  Learning
                </label>

                <label>
                  <input type="checkbox" name="interests" value="health" />
                  Health & Wellness
                </label>

                <label>
                  <input type="checkbox" name="interests" value="social" />
                  Social & Community
                </label>

                <label>
                  <input type="checkbox" name="interests" value="cooking" />
                  Cooking & Baking
                </label>
              </div>
            </fieldset>

            <button id="newsletter-button" type="submit">Sign Up</button>
          </form>
        </section>
      </main>
      <footer>
        <p>&copy; 2026 HobbyHub. All rights reserved.</p>
        <div class="social-media">
          <a href="mailto:info@hobbyhub.com">Contact Us</a>
          <a href="#"><img src="/img/insta.png" alt="Instagram" /></a>
          <a href="#"><img src="/img/twitter.png" alt="Twitter" /></a>
          <a href="#"><img src="/img/fb.png" alt="Facebook" /></a>
        </div>
      </footer>
    </div>
    <script src="/script.js"></script>
  </body>
</html>
